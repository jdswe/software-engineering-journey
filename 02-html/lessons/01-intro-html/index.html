<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Web sobre el lenguaje de marcado de hipertexto HTML"
    />
    <title>HTML | Apréndelo desde cero</title>
  </head>

  <body>
    <h1>HTML</h1>
    <p>
      HTML es un lenguaje de marcado de hipertexto que nos permite
      <strong>estructurar</strong> la información de una página web.
    </p>

    <h2>¿Para qué sirve?</h2>
    <ul>
      <li>Diseñar la estructura de la web.</li>
      <li>Crear nuestros proyectos.</li>
      <li>Puedo enlazar paginas entre si.</li>
    </ul>

    <h2>Documentación oficial</h2>
    <!-- noopener nos protege al abrir un enlace en una pestaña nueva, impidiendo que puedan
     modificar nuestra web o hacer algo malicioso desde window.opener. Es decir, al activarlo,
     los hackers no tendrán acceso a esa información, y noreferrer no envía información
     a la página desde la que se abrió el enlace. -->
    <p>
      <a
        href="https://html.spec.whatwg.org/"
        target="_blank"
        rel="noopener noreferrer"
        >Sitio oficial de HTML</a
      >
    </p>
  </body>
</html>
